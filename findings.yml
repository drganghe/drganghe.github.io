- title: "Global Supply Chains Reduce Solar Costs"
  category: "Clean Energy Supply Chains"
  number: "$67 Billion"
  description: >-
    Globalized supply chains have saved solar installers in the
    U.S., Germany, and China $67 billion from 2008–2020.
    Solar prices could be 20–30% higher in 2030 if countries
    move toward domestic-only production.
  journal: "Nature"
  year: 2022
  url: "/posts/2022-10-nature-cost-savings-of-global-solar-pv-value-chains/"
  order: 2


- title: "Imported Solar Panels Deliver Major Benefits"
  category: "Energy, Trade, and Health"
  number: "595 Avoided Deaths"
  description: >-
    Imported solar PVs contributed to 178 million tonnes of
    avoided CO₂ emissions and 595 avoided premature deaths
    in the United States, generating an estimated $28 billion
    in climate and health benefits.
  journal: "One Earth"
  year: 2025
  url: "/posts/2025-10-oneearth-imported-solar-pv-health-climate-benefits-in-the-united-states/"
  order: 1


- title: "Renewable Pathways are Cost-Effective"
  category: "Accelerating Energy Transitions"
  number: "11% Cheaper"
  description: >-
    Rapid cost reductions in renewable energy and storage
    technologies reshaped the energy transition landscape,
    showing that a renewable-dominant pathway is both
    technologically sound and cost-effective.
  journal: "Nature Communications"
  year: 2020
  url: "/posts/2020-05-ncomms-rapid-re-cost/"
  order: 3

- title: "Coal Power Workers Transition to Green Jobs is Not Easy"
  category: "Just Energy Transition"
  number: "194 km"
  description: >-
    Fewer than 15% of China’s coal power plant workforce will find it easy to shift into green jobs with matching skills; a coal power worker needs to travel 194 (178–242) km on average to access a green job.
  journal: "One Earth"
  year: 2024
  url: "https://deeppolicylab.github.io/news/2024-11-06-one-earth-coal-jobs-transition.html"
  order: 5

- title: "Climate Change Reduces Supply-Demand Match"
  category: "Climate and Energy Systems"
  number: "32% and 44%"
  description: >-
    Up to 32% and 44% of non-Antarctic land areas for wind and solar, respectively, are projected to experience supply–demand match reductions by the end of this century under an intermediate emission scenario.
  journal: "Nature Energy"
  year: 2023
  url: "/posts/2023-07-nenergy-climate-change-impacts-supply-demand-match/"
  order: 4  